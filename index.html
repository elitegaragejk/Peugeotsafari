<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Regularity</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b0e12;color:#eef2f6;font-family:-apple-system,Helvetica,Arial,sans-serif;overflow:hidden}
#app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;gap:6px;padding:calc(env(safe-area-inset-top,0px) + 6px) 8px calc(env(safe-area-inset-bottom,0px) + 8px)}
.top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#9aa7b5}
#clock{font-size:26px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
.mid{display:grid;grid-template-columns:44% 1fr;gap:8px;min-height:0}
.card{background:#161b22;border-radius:14px;padding:8px;min-height:0}
.odo{display:flex;flex-direction:column;gap:6px}
#m{font-size:46px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;color:#ffd24a;line-height:1.1;margin-top:4px}
.u{text-align:center;font-size:12px;color:#9aa7b5;margin-top:-4px}
#spd{text-align:center;font-size:15px;color:#cfd8e2}
.g{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex:1}
button{background:#2a3340;color:#fff;border:0;border-radius:10px;font-size:17px;font-weight:700;padding:8px 4px}
button:active{background:#3b4757}
.go{background:#1f8f4e}.stop{background:#b23a3a}.warn{background:#6b5a1f}
.tul{display:flex;flex-direction:column;gap:6px}
#img{flex:1;min-height:0;background:#0b0e12 center/contain no-repeat;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#6b7785;font-size:13px;text-align:center}
.row{display:flex;gap:6px}.row button{flex:1;font-size:15px}
.stage{display:flex;flex-direction:column;gap:6px}
#sn{font-size:15px;font-weight:700}
.nums{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:4px}
.nums div span{display:block;font-size:11px;color:#9aa7b5}
.nums div b{font-size:22px;font-variant-numeric:tabular-nums}
#diff.late{color:#ff6b6b}#diff.early{color:#6bd0ff}#diff.ok{color:#6bff9a}
dialog{background:#161b22;color:#fff;border:0;border-radius:14px;width:92%;max-height:85dvh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.7)}
input{width:100%;padding:9px;border-radius:8px;border:1px solid #3b4757;background:#0b0e12;color:#fff;font-size:16px;margin:3px 0}
.li{display:flex;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid #2a3340;font-size:14px}
.li div{flex:1}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div id="clock">--:--:--</div>
    <div style="text-align:right"><div id="sync">ώρα: συσκευή</div><div id="gps">GPS: off</div></div>
  </div>

  <div class="mid">
    <div class="card odo">
      <div id="m">0</div><div class="u">μέτρα</div>
      <div id="spd">0 km/h</div>
      <div class="g">
        <button onclick="adj(-10)">−10</button><button onclick="adj(10)">+10</button>
        <button onclick="adj(-1)">−1</button><button onclick="adj(1)">+1</button>
        <button class="go" id="gbtn" onclick="toggleGps()">GPS</button>
        <button class="warn" onclick="zero()">Μηδεν.</button>
      </div>
    </div>
    <div class="card tul">
      <div id="img" onclick="nextT(1)">Πάτα + για φωτο τουλίπας</div>
      <div class="row">
        <button onclick="nextT(-1)">◀</button>
        <span id="tc" style="align-self:center;font-size:13px;min-width:38px;text-align:center">0/0</span>
        <button onclick="nextT(1)">▶</button>
        <button onclick="document.getElementById('file').click()">＋</button>
        <button onclick="delT()">🗑</button>
      </div>
      <input type="file" id="file" accept="image/*" multiple hidden>
    </div>
  </div>

  <div class="card stage">
    <div class="row" style="align-items:center">
      <div id="sn" style="flex:1">Καμία ειδική</div>
      <button style="flex:0 0 auto;padding:6px 12px;font-size:14px" onclick="openS()">Ειδικές</button>
    </div>
    <div class="nums">
      <div><span>Χρόνος</span><b id="el">0:00.0</b></div>
      <div><span>Στόχος</span><b id="tg">0:00.0</b></div>
      <div><span>Διαφορά</span><b id="diff">0.0</b></div>
    </div>
    <div class="row">
      <button class="go" onclick="startS()">ΕΝΑΡΞΗ</button>
      <button class="stop" onclick="stopS()">ΛΗΞΗ</button>
    </div>
  </div>
</div>

<dialog id="dlg">
  <div style="padding:12px">
    <b>Ειδικές διαδρομές</b>
    <div id="list"></div>
    <input id="nn" placeholder="Όνομα (π.χ. ΕΔ1)">
    <input id="nl" type="number" inputmode="decimal" placeholder="Μήκος σε μέτρα">
    <input id="nk" type="number" inputmode="decimal" placeholder="Μέση ταχύτητα km/h">
    <div class="row" style="margin-top:8px">
      <button onclick="addS()">Προσθήκη</button>
      <button onclick="document.getElementById('dlg').close()">Κλείσιμο</button>
    </div>
  </div>
</dialog>

<script>
var $=function(i){return document.getElementById(i)};
function ld(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){alert('Γέμισε η μνήμη, σβήσε φωτο')}}

/* ---- Time ---- */
var offset=0;
function now(){return Date.now()+offset}
function syncTime(){
  var t0=Date.now();
  fetch('https://worldtimeapi.org/api/ip',{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){
    var t1=Date.now();var srv=j.unixtime*1000+500;
    offset=srv-(t0+(t1-t0)/2);
    $('sync').textContent='ώρα: συγχρον. ('+Math.round(offset)+'ms)';
  }).catch(function(){$('sync').textContent='ώρα: συσκευή (όχι δίκτυο)'});
}
syncTime();setInterval(syncTime,300000);
function p2(n){return n<10?'0'+n:''+n}
function fmt(ms){var s=Math.abs(ms)/1000;var m=Math.floor(s/60);return m+':'+(s%60<10?'0':'')+(s%60).toFixed(1)}

/* ---- Odometer ---- */
var dist=ld('dist',0),last=null,watch=null,speed=0,wl=null;
function render(){$('m').textContent=Math.round(dist)}
function adj(n){dist=Math.max(0,dist+n);sv('dist',dist);render()}
function zero(){if(confirm('Μηδενισμός χιλιομετρητή;')){dist=0;sv('dist',0);render()}}
function hav(a,b,c,d){var R=6371000,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r;
  var h=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)*Math.sin(y/2);
  return 2*R*Math.asin(Math.sqrt(h))}
function toggleGps(){
  if(watch!==null){navigator.geolocation.clearWatch(watch);watch=null;last=null;speed=0;
    $('gps').textContent='GPS: off';$('gbtn').className='go';$('gbtn').textContent='GPS';
    if(wl){try{wl.release()}catch(e){}wl=null}return}
  if(!navigator.geolocation){alert('Δεν υπάρχει GPS');return}
  $('gps').textContent='GPS: ψάχνει...';
  watch=navigator.geolocation.watchPosition(function(p){
    var c=p.coords;$('gps').textContent='GPS: ±'+Math.round(c.accuracy)+'m';
    if(c.accuracy>35){return}
    if(last){
      var d=hav(last.lat,last.lon,c.latitude,c.longitude);
      var dt=(p.timestamp-last.t)/1000;
      if(d>=2&&dt>0&&d/dt<90){dist+=d;sv('dist',dist);render();last={lat:c.latitude,lon:c.longitude,t:p.timestamp}}
      else if(d<2){last.t=p.timestamp}
    }else{last={lat:c.latitude,lon:c.longitude,t:p.timestamp}}
    speed=(c.speed!=null&&c.speed>=0)?c.speed*3.6:0;
    $('spd').textContent=Math.round(speed)+' km/h';
  },function(e){
    $('gps').textContent='GPS: σφάλμα ('+e.code+')';
    if(e.code===1)alert('Άφησε την τοποθεσία στο Safari: Ρυθμίσεις > Απόρρητο > Υπηρεσίες Τοποθεσίας > Safari Websites');
  },{enableHighAccuracy:true,maximumAge:0,timeout:15000});
  $('gbtn').className='stop';$('gbtn').textContent='ΣΤΟΠ';
  if(navigator.wakeLock){navigator.wakeLock.request('screen').then(function(l){wl=l}).catch(function(){})}
}

/* ---- Tulips ---- */
var tul=ld('tul',[]),ti=0;
function showT(){
  var im=$('img');
  if(tul.length){im.style.backgroundImage='url('+tul[ti]+')';im.textContent='';$('tc').textContent=(ti+1)+'/'+tul.length}
  else{im.style.backgroundImage='none';im.textContent='Πάτα ＋ για φωτο τουλίπας';$('tc').textContent='0/0'}
}
function nextT(n){if(!tul.length)return;ti=(ti+n+tul.length)%tul.length;showT()}
function delT(){if(tul.length&&confirm('Σβήσιμο τουλίπας;')){tul.splice(ti,1);ti=Math.max(0,ti-1);sv('tul',tul);showT()}}
$('file').addEventListener('change',function(e){
  var fs=Array.prototype.slice.call(e.target.files);
  fs.forEach(function(f){
    var r=new FileReader();
    r.onload=function(){
      var im=new Image();
      im.onload=function(){
        var s=Math.min(1,700/Math.max(im.width,im.height));
        var c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        tul.push(c.toDataURL('image/jpeg',0.7));ti=tul.length-1;sv('tul',tul);showT();
      };im.src=r.result;
    };r.readAsDataURL(f);
  });
  e.target.value='';
});

/* ---- Stages ---- */
var stages=ld('stages',[]),cur=ld('cur',-1),run=ld('run',null);
function curS(){return stages[cur]||null}
function renderS(){
  var s=curS();$('sn').textContent=s?(s.n+' · '+s.l+'m · '+s.k+' km/h'):'Καμία ειδική';
}
function openS(){
  var h='';
  stages.forEach(function(s,i){
    h+='<div class="li"><div><b>'+esc(s.n)+'</b><br>'+s.l+' m · '+s.k+' km/h</div>'+
    '<button onclick="selS('+i+')">'+(i===cur?'✔':'Επιλογή')+'</button>'+
    '<button onclick="delS('+i+')">🗑</button></div>';
  });
  $('list').innerHTML=h||'<div style="padding:8px;color:#9aa7b5">Δεν υπάρχουν ειδικές</div>';
  $('dlg').showModal();
}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function addS(){
  var n=$('nn').value.trim(),l=parseFloat($('nl').value),k=parseFloat($('nk').value);
  if(!n||!(l>0)||!(k>0)){alert('Συμπλήρωσε όνομα, μήκος και ταχύτητα');return}
  stages.push({n:n,l:l,k:k});sv('stages',stages);
  if(cur<0){cur=0;sv('cur',0)}
  $('nn').value=$('nl').value=$('nk').value='';renderS();openS();
}
function selS(i){cur=i;sv('cur',i);run=null;sv('run',null);renderS();openS()}
function delS(i){stages.splice(i,1);cur=stages.length?0:-1;sv('stages',stages);sv('cur',cur);renderS();openS()}
function startS(){
  if(!curS()){alert('Διάλεξε ειδική');return}
  run={t:now(),d:dist};sv('run',run);
}
function stopS(){run=null;sv('run',null);$('el').textContent='0:00.0';$('tg').textContent='0:00.0';$('diff').textContent='0.0';$('diff').className=''}

/* ---- Loop ---- */
setInterval(function(){
  var d=new Date(now());
  $('clock').textContent=p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds());
  var s=curS();
  if(run&&s){
    var el=now()-run.t;
    var covered=Math.max(0,dist-run.d);
    var tg=covered/(s.k/3.6)*1000;
    var df=(el-tg)/1000;
    $('el').textContent=fmt(el);$('tg').textContent=fmt(tg);
    var e=$('diff');e.textContent=(df>0?'+':df<0?'−':'')+Math.abs(df).toFixed(1);
    e.className=Math.abs(df)<0.5?'ok':(df>0?'late':'early');
  }
},100);

render();showT();renderS();
</script>
</body>
</html>
